<meta name="robots" content="noindex,nofollow">
<title>Dr. Veysel Özcan | Hasta Takip</title>
<style>
:root{--bg:#eef5fc;--c:#fff;--t:#14283d;--m:#5b7186;--p:#2f74b5;--pd:#17426b;--bad:#b3261e;--ok:#1f7a4d;--b:#d3e3f3;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.45 -apple-system,system-ui,sans-serif}
main{padding:14px 14px 100px;max-width:680px;margin:auto}
h2{font:600 28px ui-serif,"New York",Georgia,serif;margin:6px 0 6px;color:var(--pd)}
h3{font:600 19px ui-serif,"New York",Georgia,serif;margin:18px 0 8px;color:var(--pd)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m,small{color:var(--m);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .card{padding:10px;margin:0}.grid b{display:block;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.g2 b{display:block;font-size:20px}
input,select{width:100%;padding:11px;margin:4px 0;border:1px solid var(--b);border-radius:10px;font:inherit;background:var(--bg);color:var(--t)}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:10px;background:var(--p);color:#fff;font:600 16px inherit;font-family:inherit}
button.lnk{background:none;color:var(--p);width:auto;padding:6px 0}
button.del{background:none;color:var(--bad);margin-top:20px}
.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok)}
.x{color:var(--m);padding:4px 8px;cursor:pointer}
.err{color:var(--bad);margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--m);border-radius:0;margin:0;padding:8px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button big{font-size:22px;line-height:1}
nav button.on{color:var(--p);font-weight:700;background:#e1eefb}
.top{position:sticky;top:0;z-index:5;background:#fff;color:var(--pd);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top img{width:50px;height:50px}.top b{display:block;font-size:18px}.top span{font-size:14px;opacity:.92}
.hero{background:linear-gradient(#fff,#e1eefb);color:var(--pd);text-align:center;padding:calc(34px + env(safe-area-inset-top)) 20px 30px}
.hero img{width:150px}.hero h2{color:var(--pd);margin:6px 0 2px}.hero p{margin:0;opacity:.92}
.lb{display:block;font-weight:600;margin-top:10px;font-size:15px}
.help{color:var(--m);margin:0 0 12px}
.past{opacity:.55}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--b)}
.chk{flex:none;width:30px;height:30px;border:2px solid var(--p);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.chk.on{background:var(--p)}
.tx{flex:1;min-width:0;word-break:break-word;font-size:17px}.tx.dn{text-decoration:line-through;color:var(--m)}
.chkl{display:flex;align-items:center;margin:8px 0;font-size:16px}.chkl input{width:auto;margin:0 8px 0 0}
.seg{display:flex;gap:8px;margin-bottom:6px}.seg button{margin:0;flex:1}
.no.nw{background:#fff3d6;color:#8a5a00}
.qty{display:flex;align-items:center;gap:10px}.qty b{min-width:28px;text-align:center;font-size:20px}
.q{width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:24px;line-height:1}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sm{width:auto;flex:1 1 44%;padding:10px 6px;margin:0;font-size:15px}
.gh{background:#e1eefb;color:var(--pd)}
.tag{display:inline-block;background:#e1eefb;color:var(--pd);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;margin-top:4px}
.tag.r{background:#fbe5e2;color:var(--bad)}
.dash b{font-size:20px!important}.dash .card{cursor:pointer}
.slot{display:flex;gap:10px;align-items:flex-start}
.slot>div:last-child{flex:1;min-width:0}
.st{width:54px;flex:none;font-weight:700;color:var(--pd);padding-top:13px}
.empty{border:1px dashed var(--b);border-radius:12px;padding:12px;color:var(--m);font-size:15px;margin:0 0 10px;background:var(--c)}
.noB{display:inline-block;background:var(--p);color:#fff;border-radius:8px;padding:3px 12px;font-weight:700;margin:2px 0 6px}
.no{background:var(--p);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px;font-weight:700;margin-right:8px}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:6px}
.mini b{font-size:13px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px}
.mini .g7{font-size:8px}
.d{border-radius:50%;line-height:1.6}
.d.has{background:var(--p);color:#fff}
.d.now{outline:1.5px solid var(--bad)}
.big{gap:4px;margin:10px 0}
.big .d{font-size:16px;padding:6px 0;border-radius:10px;line-height:1.2}
.big .d u{display:block;font-size:12px;font-weight:700;text-decoration:none}
.d.sel{outline:2px solid var(--t)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars small{font-size:9px}
.bars i{display:block;width:100%;background:var(--p);border-radius:3px 3px 0 0;min-height:2px}
summary{font-weight:600;cursor:pointer}
</style>

function parseImp(rows,pat){
  rows=rows.filter(x=>x.some(c=>String(c).trim()));
  if(!rows.length)return{err:'Dosyada kayıt bulunamadı.'};
  const L=/[A-Za-zÇĞİÖŞÜçğıöşü]/,dg=c=>String(c).replace(/\D/g,'').length,isPh=c=>dg(c)>=9&&!L.test(String(c)),isNm=c=>/[A-Za-zÇĞİÖŞÜçğıöşü]{2}/.test(String(c))&&dg(c)<4,isNo=c=>/^\d{1,6}$/.test(String(c).trim());
  const hasH=!rows[0].some(isPh),data=rows.slice(hasH?1:0),smp=data.slice(0,300),n=smp.length||1,w=Math.max(...smp.map(x=>x.length),0);
  let tc=-1,tb=.3,dc=-1;const nc=[];
  for(let i=0;i<w;i++){const f=fn=>smp.filter(x=>fn(x[i])).length/n,p=f(isPh),m=f(isNm),d=f(isNo);
    if(p>tb){tb=p;tc=i}else if(d>.8&&dc<0)dc=i;else if(m>.5)nc.push(i)}
  if(!nc.length)return{err:'Ad sütunu bulunamadı. Dosyada isimlerin olduğu bir sütun olmalı.'};
  const fp=c=>{let d=String(c).replace(/\D/g,'');if(!d)return'';if(d.length===10&&d[0]==='5')d='0'+d;else if(d.length===12&&d.startsWith('90'))d='0'+d.slice(2);
    if(d.length===11&&d[0]==='0')return d.replace(/(\d{4})(\d{3})(\d{2})(\d{2})/,'$1 $2 $3 $4');return d.length>=7?d:String(c).trim()};
  const key=x=>nz(x.name)+'|'+String(x.tel).replace(/\D/g,'').slice(-10);
  const byNo=new Map(),byKey=new Map(),push=(m,k,v)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(v)};
  pat.forEach(p=>{if(p.no)push(byNo,String(p.no),p.id);else push(byKey,key({name:p.name||'',tel:p.tel||''}),p.id)});
  const ops=[];let nNew=0,nUpd=0,nSame=0,noTel=0,total=0;
  data.forEach(r=>{const no=dc>=0?String(r[dc]||'').trim():'';
    const name=nc.map(i=>String(r[i]||'').trim()).filter(Boolean).join(' ').replace(/\s+/g,' ')||(no?'(İsimsiz)':'');
    if(!name)return;total++;const tel=tc>=0?fp(r[tc]||''):'';const x={name,tel,no};
    if(no&&byNo.get(no)&&byNo.get(no).length){byNo.get(no).shift();nSame++;return}
    const k=key(x),ex=byKey.get(k);
    if(ex&&ex.length){const id=ex.shift();if(!no){nSame++;return}ops.push({t:'upd',id,...x});nUpd++}
    else{ops.push({t:'new',...x});nNew++}
    if(!tel)noTel++});
  return{ops,info:{total,nNew,nUpd,nSame,noTel,hasNo:dc>=0}}}

  const up=l.filter(x=>x.date>=t),past=l.filter(x=>x.date<t).reverse().slice(0,15);
  const row=(x,c)=>{const p=S.pat.find(z=>z.id===x.pid);return `<div class="card row ${c}"><div onclick="A.open('${x.pid}')"><b>${e(x.time)} ${e(p?p.name:'Silinmiş hasta')}${p&&p.no?' (No '+e(p.no)+')':p&&p.yeni?' · Yeni hasta':''}</b><div class="m">${fmt(x.date)}${x.date===t?' (bugün)':''} ${e(x.type)} ${e(x.note)}</div></div><span><span class="x" onclick="A.wa('apt','${x.id}')">💬</span><span class="x" onclick="A.del('apt','${x.id}')">✕</span></span></div>`};
  return `<h2>Takvim</h2>${taskView()}<p class="help">Önce aya, sonra güne dokunun. Gün açılınca tüm randevuları saat saat görürsünüz. Yeni randevuyu sayfanın altındaki formdan ya da boş saate dokunarak ekleyin.</p><div class="card"><b>Bugün: ${S.apt.filter(x=>x.date===t).length} randevu</b><div class="m">Çalışma saatleri 10:30 - 19:30</div></div>${calView(row)}<h3>Randevu ekle</h3><div class="card" id="aF">${S.rb?'<p class="ok"><b>Hatırlatmadan randevu oluşturuluyor.</b> Kaydedince hatırlatma listeden kalkar.</p>':''}<div class="seg"><button class="${S.ak==='new'?'gh':''}" onclick="A.ak('old')">Kayıtlı hasta</button><button class="${S.ak==='new'?'':'gh'}" onclick="A.ak('new')">Yeni hasta</button></div>${S.ak==='new'?`<p class="m">Dosya numarası yok. Hasta ilk geldiğinde numarayı Ana Sayfa'dan verirsiniz.</p><label class="lb">Ad soyad</label><input id="nN" placeholder="Örnek: Ayşe Yılmaz"><label class="lb">Telefon</label><input id="nT" type="tel" placeholder="05xx xxx xx xx"><label class="lb">Hitap (mesajlarda kullanılır)</label><select id="nH">${opts(['Hanım','Bey'])}</select>`:`<label class="lb">Hasta ara</label><input id="aQ" placeholder="Adın bir kısmını yazın" oninput="A.aq(this.value)"><label class="lb">Hasta seçin</label><select id="aP">${aOpts('')}</select>`}<label class="lb">Tarih</label><input id="aD" type="date" value="${S.cd||t}"><label class="lb">Saat</label><input id="aT" type="time" value="${S.at||'10:30'}"><label class="lb">İşlem</label><select id="aY">${optsS(TYPES.concat(['Kontrol']),S.aty)}</select><label class="lb">Not (isteğe bağlı)</label><input id="aN" placeholder="Not"><button onclick="A.addApt()">Randevu ekle</button></div>
<h3>Yaklaşan</h3>${up.map(x=>row(x,'')).join('')||'<p class="m">Yaklaşan randevu yok.</p>'}
${past.length?`<h3>Geçmiş</h3>${past.map(x=>row(x,'past')).join('')}`:''}${remView()}`}

function takipView(){
  const t=td(),soon=ymd(new Date(Date.now()+30*864e5)),tom=ymd(new Date(Date.now()+864e5));
  const dd=S.pat.map(p=>({p,d:debt(p.id)})).filter(x=>x.d>0).sort((x,y)=>y.d-x.d);

  const ta=S.apt.filter(x=>x.date===tom).sort((x,y)=>x.time.localeCompare(y.time));
  const nm=id=>(S.pat.find(z=>z.id===id)||{}).name||'Silinmiş hasta';
  return `<h3>Yarınki randevular</h3>${ta.map(x=>`<div class="card row"><div onclick="A.open('${x.pid}')"><b>${e(x.time)} ${e(nm(x.pid))}</b><div class="m">${e(x.type)}</div></div><span class="x" onclick="A.wa('apt','${x.id}')">💬</span></div>`).join('')||'<p class="m">Yarın için randevu yok.</p>'}
<h3>Hatırlatmalar</h3><div class="card row"><div><b>${S.rem.filter(r=>r.status!=='tamam'&&r.due<=t).length} kişinin hatırlatma zamanı geldi</b><div class="m">Takvim sayfasının en altında</div></div><button class="sm" style="flex:none" onclick="A.goRem()">Aç</button></div>
<h3>Borçlu hastalar (${dd.length})</h3>${dd.slice(0,15).map(x=>`<div class="card row"><div onclick="A.open('${x.p.id}')"><b>${e(x.p.name)}</b><div class="m">${x.p.no?'Dosya '+e(x.p.no)+' · ':''}${e(x.p.tel)}</div></div><div><span class="bad">${tl(x.d)}</span><span class="x" onclick="A.wa('debt','${x.p.id}')">💬</span></div></div>`).join('')+(dd.length>15?`<p class="m">... ve ${dd.length-15} kişi daha</p>`:'')||'<p class="m">Borçlu hasta yok.</p>'}`}
function revView(){
  const dp=S.pay.filter(x=>x.date===S.d),dt=S.trt.filter(x=>x.date===S.d),mp=S.pay.filter(x=>(x.date||'').startsWith(S.m)),mt=S.trt.filter(x=>(x.date||'').startsWith(S.m));
  const open=S.pat.reduce((s,p)=>s+Math.max(0,debt(p.id)),0);
  const mv=Array.from({length:12},(_,i)=>sum(S.pay.filter(x=>(x.date||'').startsWith(S.ry+'-'+String(i+1).padStart(2,'0')))));const mx=Math.max(...mv,1);
  const chart=`<h3>Yıllık tahsilat</h3><div class="card"><div class="row"><button class="lnk" onclick="A.set('ry',${S.ry-1})">‹</button><b>${S.ry}: ${tl(sum(mv))}</b><button class="lnk" onclick="A.set('ry',${S.ry+1})">›</button></div><div class="bars">${mv.map((x,i)=>`<div><small>${x?Math.round(x/1000):''}</small><i style="height:${Math.round(x/mx*100)}px"></i><small>${AY[i].slice(0,3)}</small></div>`).join('')}</div><p class="m">Rakamlar bin ₺ cinsinden.</p></div>`;
  return `<h2>Ciro</h2><p class="help"><b>Tahsilat:</b> kasaya giren para. <b>Yapılan işlem:</b> verilen hizmetin toplam tutarı.</p><h3>Günlük</h3><div class="card"><input type="date" value="${S.d}" onchange="A.set('d',this.value||td())"><div class="g2"><div><small>Tahsilat</small><b>${tl(sum(dp))}</b></div><div><small>Yapılan işlem</small><b>${tl(sum(dt))}</b></div></div></div>
<h3>Aylık</h3><div class="card"><input type="month" value="${S.m}" onchange="A.set('m',this.value||td().slice(0,7))"><div class="g2"><div><small>Tahsilat</small><b>${tl(sum(mp))}</b></div><div><small>Yapılan işlem</small><b>${tl(sum(mt))}</b></div></div>
${METHODS.map(k=>`<div class="row" style="margin-top:8px"><span class="m">${k}</span><span>${tl(sum(mp.filter(x=>x.method===k)))}</span></div>`).join('')}</div>
${chart}<div class="card"><small>Tüm hastaların toplam açık borcu</small><div class="bad" style="font-size:22px">${tl(open)}</div></div>
<button onclick="A.bak()">Yedeği indir</button><button class="lnk" onclick="A.out()">Çıkış yap</button>`}

function render(){
  const a=document.getElementById('app');
  if(!S.u){a.innerHTML=loginView();return}
  const view=S.sel?patView():S.tab==='apt'?aptView():S.tab==='rev'?revView():S.tab==='stk'?stokView():S.tab==='pat'?listView():homeView();
  const nb=(k,i,n)=>`<button class="${S.tab===k&&!S.sel?'on':''}" onclick="A.tab('${k}')"><big>${i}</big>${n}</button>`;
  a.innerHTML=`<header class="top"><img src="${LOGO}" alt="Logo"><div><b>Dr. Veysel Özcan</b><span>${S.u.email&&NAMES[S.u.email.toLowerCase()]?'Hoş geldiniz, '+NAMES[S.u.email.toLowerCase()]:'Hasta Takip Sistemi'}</span></div></header><main>${S.err?`<div class="err">${e(S.err)}</div>`:''}${view}</main><nav>${nb('home','🏠','Ana Sayfa')}${nb('pat','👥','Hastalar')}${nb('apt','📅','Takvim')}${nb('stk','📦','Stok')}${nb('rev','💰','Ciro')}</nav>`;
}

const num=id=>parseFloat(v(id).replace(',','.'));
const add=(k,d)=>addDoc(collection(db,C[k]),{...d,at:Date.now()}).catch(er=>{S.err='Kaydedilemedi ('+er.code+')';render()});
window.A={
  login(){signInWithEmailAndPassword(auth,v('em'),document.getElementById('pw').value).catch(()=>{S.err='E-posta veya şifre hatalı.';render()})},
  out(){signOut(auth)},
  tab(t){if(t!=='apt'){S.rb=null;S.ap=null;S.aty=null}S.tab=t;S.sel=null;render();scrollTo(0,0)},
  open(id){S.sel=id;render();scrollTo(0,0)},
  back(){S.sel=null;render();scrollTo(0,0)},
  set(k,x){S[k]=x;render()},
  yr(n){S.y+=n;render()},
  mon(m){S.cm=m;S.cd=null;render()},
  mm(n){let m=S.cm+n;if(m<0){m=11;S.y--}else if(m>11){m=0;S.y++}S.cm=m;S.cd=null;render()},
  day(k){S.cd=k;S.at=null;render();setTimeout(()=>{const d=document.getElementById('dayv');if(d)d.scrollIntoView({behavior:'smooth'})},50)},
  slot(t){S.at=t;render();setTimeout(()=>{const d=document.getElementById('aF');if(d)d.scrollIntoView({behavior:'smooth'})},50)},
  xl(f){if(!f)return;S.impMsg='';const r=new FileReader();
    r.onerror=()=>alert('Dosya okunamadı.');
    r.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const x=parseImp(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}),S.pat);
      if(x.err)return alert(x.err);
      S.imp=x.ops.length?x.ops:null;S.impInfo=x.info;if(!x.ops.length)S.impMsg='Eklenecek ya da güncellenecek kayıt yok. Hepsi zaten eksiksiz kayıtlı.';render()
    }catch(er){alert('Dosya okunamadı. Excel (.xlsx) ya da .csv olmalı.')}};
    r.readAsArrayBuffer(f)},
  imp(){const l=S.imp;if(!l)return;const tag=Date.now().toString(36);l.forEach((x,i)=>{if(x.t==='new')x.id=tag+'-'+i});S.imp=null;S.impMsg='Aktarılıyor, lütfen ekranı kapatmayın...';render();
    bulk(l,(b,x)=>x.t==='new'?b.set(doc(db,C.pat,x.id),{name:x.name,tel:x.tel,no:x.no,birth:'',note:'',at:Date.now()}):b.update(doc(db,C.pat,x.id),{no:x.no})).then(()=>{S.impMsg='Tamamlandı: '+l.length+' kayıt işlendi.';render()}).catch(er=>{S.err='Aktarılamadı ('+er.code+'). Bağlantıyı kontrol edip dosyayı yeniden seçin, kaldığı yerden devam eder.';render()})},
  clean(){const l=bad().filter(p=>!S.trt.some(x=>x.pid===p.id)&&!S.pay.some(x=>x.pid===p.id)&&!S.apt.some(x=>x.pid===p.id));if(!l.length)return;
    if(!confirm(l.length+' hatalı kayıt silinsin mi? Bunlarda işlem, ödeme ya da randevu yok.'))return;
    S.impMsg='Siliniyor, lütfen bekleyin...';render();
    bulk(l,(b,p)=>b.delete(doc(db,C.pat,p.id))).then(()=>{S.impMsg=l.length+' hatalı kayıt silindi. Şimdi Excel dosyasını yeniden yükleyebilirsiniz.';render()}).catch(er=>{S.err='Silinemedi ('+er.code+')';render()})},
  aq(q){document.getElementById('aP').innerHTML=aOpts(q)},
  today(){const n=new Date();S.y=n.getFullYear();S.cm=n.getMonth();S.cd=td();render()},
  upd(id){const n=v('eN');if(!n)return alert('Ad soyad yazın.');updateDoc(doc(db,C.pat,id),{name:n,no:v('eF'),yeni:v('eF')?false:!!((S.pat.find(x=>x.id===id)||{}).yeni),hitap:v('eH'),tel:v('eT'),birth:v('eB'),note:v('eM')}).catch(er=>{S.err='Güncellenemedi ('+er.code+')';render()})},
  wa(k,id){let p,m;
    if(k==='apt'){const x=S.apt.find(z=>z.id===id);if(!x)return;p=S.pat.find(z=>z.id===x.pid);if(!p)return;m=`${hi(p)} merhaba. Nasılsınız?😊\n${fmt(x.date)} saat ${x.time} randevunuzu hatırlatmak isteriz. Görüşmek üzere. Dr. Veysel Özcan`}
    else{p=S.pat.find(z=>z.id===id);if(!p)return;m=`${hi(p)} merhaba. Nasılsınız?😊\nKliniğimizdeki ${tl(debt(id))} tutarındaki kalan bakiyeniz hakkında bilgi vermek istedik. İyi günler dileriz. Dr. Veysel Özcan`}
    openWa(p,m)},
  remWa(id){const r=S.rem.find(z=>z.id===id);if(!r)return;const p=S.pat.find(z=>z.id===r.pid);if(!p)return;
    const m=`${hi(p)} merhaba. Nasılsınız?😊\n${r.type} hatırlatma randevunuz için yazıyorum. Sizin için bir randevu oluşturalım ister misiniz?`;
    if(openWa(p,m))updateDoc(doc(db,C.rem,id),{status:'yazildi',sent:td()}).catch(()=>{})},
  remBook(id){const r=S.rem.find(z=>z.id===id);if(!r)return;S.rb=id;S.ap=r.pid;S.aty=r.type;S.at=null;S.ak='old';render();setTimeout(()=>{const d=document.getElementById('aF');if(d)d.scrollIntoView({behavior:'smooth'})},50)},
  remSnooze(id){const r=S.rem.find(z=>z.id===id);if(!r)return;updateDoc(doc(db,C.rem,id),{due:ymd(new Date(new Date(r.due+'T12:00:00').getTime()+7*864e5)),status:'bekliyor'}).catch(()=>{})},
  remDone(id){if(confirm('Bu hatırlatma kapatılsın mı? Listeden kalkar.'))updateDoc(doc(db,C.rem,id),{status:'tamam'}).catch(()=>{})},
  addRem(){add('rem',{pid:S.sel,type:v('rT'),due:v('rD')||addM(td(),3),last:'',status:'bekliyor'});alert('Hatırlatma kaydedildi. Takvim sayfasının en altında görünür.')},
  ak(m){S.ak=m;render()},
  tadd(){const x=v('tX');if(!x)return alert('Görevi yazın.');add('tsk',{text:x,date:v('tD2')||td(),daily:document.getElementById('tR').checked,done:false})},
  tgl(id){const x=S.tsk.find(z=>z.id===id);if(!x)return;updateDoc(doc(db,C.tsk,id),x.daily?{[tkey()]:!x[tkey()]}:{done:!x.done}).catch(er=>{S.err='Güncellenemedi ('+er.code+')';render()})},
  tdel(id){const x=S.tsk.find(z=>z.id===id);if(!x)return;if(x.daily&&!confirm('Bu görev her gün tekrarlanıyor. Tamamen silinsin mi?'))return;deleteDoc(doc(db,C.tsk,id))},
  setNo(id){const n=v('qF');if(!n)return alert('Dosya numarasını yazın.');if(S.pat.some(x=>x.id!==id&&String(x.no)===n)&&!confirm('Bu dosya numarası başka bir hastada var. Yine de kaydedilsin mi?'))return;updateDoc(doc(db,C.pat,id),{no:n,yeni:false}).catch(er=>{S.err='Kaydedilemedi ('+er.code+')';render()})},
  sedit(id){S.se=id;render()},
  sadd(){const n=v('sA');if(!n)return alert('Ürün adını yazın.');add('stk',{cat:v('sC'),name:n,qty:parseInt(v('sB'))||0,min:v('sU')===''?2:(parseInt(v('sU'))||0),note:''})},
  sq(id,d){const x=S.stk.find(z=>z.id===id);if(!x||(d<0&&(+x.qty||0)<=0))return;updateDoc(doc(db,C.stk,id),{qty:increment(d)}).catch(er=>{S.err='Stok güncellenemedi ('+er.code+')';render()});add('slg',{iid:id,name:x.name,d,date:td()})},
  ssave(id){const x=S.stk.find(z=>z.id===id);if(!x)return;const q=parseInt(v('sQ'))||0,old=+x.qty||0,nm=v('sN')||x.name;
    updateDoc(doc(db,C.stk,id),{name:nm,qty:q,min:parseInt(v('sM'))||0}).catch(er=>{S.err='Kaydedilemedi ('+er.code+')';render()});
    if(q!==old)add('slg',{iid:id,name:nm,d:q-old,date:td(),note:'düzeltme'});S.se=null;render()},
  sdel(id){if(confirm('Bu ürün silinsin mi?')){deleteDoc(doc(db,C.stk,id));S.se=null;render()}},
  seed(){const b=writeBatch(db);SEED.forEach(([c,n])=>b.set(doc(db,C.stk,'seed-'+nz(n).replace(/[^a-z0-9]/g,'')),{cat:c,name:n,qty:0,min:2,note:'',at:Date.now()}));b.commit().catch(er=>{S.err='Eklenemedi ('+er.code+')';render()})},
  goRem(){A.tab('apt');setTimeout(()=>{const d=document.getElementById('remv');if(d)d.scrollIntoView({behavior:'smooth'})},80)},
  q(x){S.q=x;document.getElementById('pl').innerHTML=plist()},
  addPat(){const n=v('pn');if(!n)return alert('Ad soyad yazın.');if(v('pF')&&S.pat.some(x=>String(x.no)===v('pF'))&&!confirm('Bu dosya numarası başka bir hastada var. Yine de eklensin mi?'))return;add('pat',{name:n,no:v('pF'),hitap:v('pH'),tel:v('pt'),birth:v('pb'),note:v('pm')}).then(r=>{if(r){S.sel=r.id;render();scrollTo(0,0)}})},
  addTrt(){const a=num('tA');if(!(a>=0))return alert('Tutarı yazın.');const d=v('tD')||td(),ty=v('tT');add('trt',{pid:S.sel,type:ty,amt:a,date:d,note:v('tN')});if(ty==='Botoks'){add('rem',{pid:S.sel,type:'Botoks',due:addM(d,3),last:d,status:'bekliyor'});alert('Botoks kaydedildi. '+fmt(addM(d,3))+' tarihi için hatırlatma oluşturuldu (Takvim sayfasının en altında).')}},
  addPay(){const a=num('pA');if(!(a>0))return alert('Tutarı yazın.');add('pay',{pid:S.sel,amt:a,method:v('pM'),date:v('pD')||td(),note:v('pN')})},
  addApt(){const d=v('aD')||td(),t=v('aT')||'10:30';if(S.apt.some(x=>x.date===d&&x.time===t)&&!confirm('Bu saatte başka bir randevu var. Yine de eklensin mi?'))return;S.y=+d.slice(0,4);S.cm=+d.slice(5,7)-1;S.cd=d;S.at=null;const ty=v('aY'),nt=v('aN'),mk=pid=>add('apt',{pid,date:d,time:t,type:ty,note:nt});
if(S.ak==='new'){const n=v('nN'),tel=v('nT');if(!n)return alert('Hastanın adını yazın.');
  const k=String(tel).replace(/\D/g,'').slice(-10),dup=k.length>=7&&S.pat.find(x=>String(x.tel||'').replace(/\D/g,'').slice(-10)===k);
  if(dup&&!confirm('Bu telefon numarası kayıtlı: '+dup.name+'. Yine de yeni hasta olarak eklensin mi? (Aynı kişiyse İptal deyip "Kayıtlı hasta" ile seçin.)'))return;
  add('pat',{name:n,no:'',yeni:true,hitap:v('nH'),tel:tel,birth:'',note:''}).then(r=>{if(r)mk(r.id)});S.ak='old'}
else mk(v('aP'));
if(S.rb){updateDoc(doc(db,C.rem,S.rb),{status:'tamam'}).catch(()=>{});S.rb=null;S.ap=null;S.aty=null}},
  del(k,id){if(confirm('Bu kayıt silinsin mi?'))deleteDoc(doc(db,C[k],id))},
  delPat(id){if(!confirm('Hasta ve tüm işlem, ödeme, randevu kayıtları silinsin mi? Geri alınamaz.'))return;
    ['trt','pay','apt','rem'].forEach(k=>S[k].filter(x=>x.pid===id).forEach(x=>deleteDoc(doc(db,C[k],x.id))));
    deleteDoc(doc(db,C.pat,id));S.sel=null;render()},
  bak(){const j=JSON.stringify({tarih:td(),gorevler:S.tsk,stok:S.stk,stokHareketleri:S.slg,hastalar:S.pat,islemler:S.trt,odemeler:S.pay,randevular:S.apt,hatirlatmalar:S.rem},null,1);
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download='klinik-yedek-'+td()+'.json';l.click()}
};
