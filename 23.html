<style>
:root{--bg:#f1f7f4;--c:#fff;--t:#10302a;--m:#4a665d;--p:#0b6b50;--pd:#084d3a;--bad:#b3261e;--ok:#0b6b50;--b:#c9ddd5;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.45 -apple-system,system-ui,sans-serif}
main{padding:14px 14px 100px;max-width:680px;margin:auto}
h2{font:600 28px ui-serif,"New York",Georgia,serif;margin:6px 0 6px;color:var(--pd)}
h3{font:600 19px ui-serif,"New York",Georgia,serif;margin:18px 0 8px;color:var(--pd)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m,small{color:var(--m);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .card{padding:10px;margin:0}.grid b{display:block;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.g2 b{display:block;font-size:20px}
input,select{width:100%;padding:11px;margin:4px 0;border:1px solid var(--b);border-radius:10px;font:inherit;background:var(--bg);color:var(--t)}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:10px;background:var(--p);color:#fff;font:600 16px inherit;font-family:inherit}
button.lnk{background:none;color:var(--p);width:auto;padding:6px 0}
button.del{background:none;color:var(--bad);margin-top:20px}
.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok)}
.x{color:var(--m);padding:4px 8px;cursor:pointer}
.err{color:var(--bad);margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--m);border-radius:0;margin:0;padding:8px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button big{font-size:22px;line-height:1}
nav button.on{color:var(--p);font-weight:700;background:#e3f1ec}
.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top img{width:50px;height:50px}.top b{display:block;font-size:18px}.top span{font-size:14px;opacity:.92}
.hero{background:var(--p);color:#fff;text-align:center;padding:calc(34px + env(safe-area-inset-top)) 20px 30px}
.hero img{width:150px}.hero h2{color:#fff;margin:6px 0 2px}.hero p{margin:0;opacity:.92}
.lb{display:block;font-weight:600;margin-top:10px;font-size:15px}
.help{color:var(--m);margin:0 0 12px}
.past{opacity:.55}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:6px}
.mini b{font-size:13px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px}
.mini .g7{font-size:8px}
.d{border-radius:50%;line-height:1.6}
.d.has{background:var(--p);color:#fff}
.d.now{outline:1.5px solid var(--bad)}
.big{gap:4px;margin:10px 0}
.big .d{font-size:16px;padding:6px 0;border-radius:10px;line-height:1.2}
.big .d u{display:block;font-size:10px;text-decoration:none}
.d.sel{outline:2px solid var(--t)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars small{font-size:9px}
.bars i{display:block;width:100%;background:var(--p);border-radius:3px 3px 0 0;min-height:2px}
summary{font-weight:600;cursor:pointer}
</style>

function parseImp(rows,pat){
  rows=rows.filter(x=>x.some(c=>String(c).trim()));
  if(!rows.length)return{err:'Dosyada kayıt bulunamadı.'};
  const L=/[A-Za-zÇĞİÖŞÜçğıöşü]/,dg=c=>String(c).replace(/\D/g,'').length,isPh=c=>dg(c)>=9&&!L.test(String(c)),isNm=c=>/[A-Za-zÇĞİÖŞÜçğıöşü]{2}/.test(String(c))&&dg(c)<4;
  const hasH=!rows[0].some(isPh),data=rows.slice(hasH?1:0),smp=data.slice(0,300),n=smp.length||1,w=Math.max(...smp.map(x=>x.length),0);
  let tc=-1,tb=.3;const nc=[];
  for(let i=0;i<w;i++){const p=smp.filter(x=>isPh(x[i])).length/n,m=smp.filter(x=>isNm(x[i])).length/n;if(p>tb){tb=p;tc=i}else if(m>.5)nc.push(i)}
  if(!nc.length)return{err:'Ad sütunu bulunamadı. Dosyada isimlerin olduğu bir sütun olmalı.'};
  const fp=c=>{let d=String(c).replace(/\D/g,'');if(!d)return'';if(d.length===10&&d[0]==='5')d='0'+d;else if(d.length===12&&d.startsWith('90'))d='0'+d.slice(2);
    if(d.length===11&&d[0]==='0')return d.replace(/(\d{4})(\d{3})(\d{2})(\d{2})/,'$1 $2 $3 $4');return d.length>=7?d:String(c).trim()};
  const key=x=>nz(x.name)+'|'+String(x.tel).replace(/\D/g,'').slice(-10);
  const have=new Set(pat.map(x=>key({name:x.name,tel:x.tel||''})));
  let skip=0,noTel=0;const out=[];
  data.forEach(r=>{const name=nc.map(i=>String(r[i]||'').trim()).filter(Boolean).join(' ').replace(/\s+/g,' ');if(!name)return;
    const tel=tc>=0?fp(r[tc]||''):'';const x={name,tel};const k=key(x);if(have.has(k)){skip++;return}have.add(k);if(!tel)noTel++;out.push(x)});
  return{out,skip,noTel}}

  const L=S.pat.filter(p=>!q||nz(p.name).includes(q)||(qd.length>=3&&String(p.tel||'').replace(/\D/g,'').includes(qd))).sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr'));
  return L.slice(0,100).map(p=>{const d=debt(p.id);return `<div class="card row" onclick="A.open('${p.id}')"><div><b>${e(p.name)}</b><div class="m">${e(p.tel)}</div></div>${d>0?`<span class="bad">${tl(d)}</span>`:''}</div>`}).join('')+(L.length>100?`<p class="m">${L.length} kişiden ilk 100'ü gösteriliyor. Ad veya telefon yazarak arayın.</p>`:'')||'<p class="m">Eşleşen hasta yok. Aşağıdan yeni hasta ekleyebilirsiniz.</p>'};

const listView=()=>`<h2>Hastalar</h2><p class="help">Hasta arayın. Hastaya dokununca işlemlerini, ödemelerini ve kalan borcunu görürsünüz.</p><input id="sq" type="search" placeholder="Ad veya telefon ara" value="${e(S.q)}" oninput="A.q(this.value)"><div id="pl">${plist()}</div>
<h3>Yeni hasta</h3><div class="card"><label class="lb">Ad soyad</label><input id="pn" placeholder="Örnek: Ayşe Yılmaz"><label class="lb">Telefon (WhatsApp için)</label><input id="pt" type="tel" placeholder="05xx xxx xx xx"><label class="lb">Doğum tarihi (isteğe bağlı)</label><input id="pb" type="date"><label class="lb">Not (isteğe bağlı)</label><input id="pm" placeholder="Alerji, tercih..."><button onclick="A.addPat()">Hastayı kaydet</button></div>
<h3>Excel'den hasta aktar</h3><div class="card"><p class="m">Excel dosyanızda ad ve telefon sütunları olsun. İlk satır başlık olabilir (Ad, Soyad, Telefon gibi). Dosya telefonunuzda <b>Dosyalar</b> uygulamasında kayıtlı olmalı.</p><input id="xf" type="file" accept=".xlsx,.xls,.csv" onchange="A.xl(this.files[0])">${bad().length?`<p class="bad">Önceki aktarımdan kalan ${bad().length} hatalı kayıt var (isim yerine sadece rakam yazıyor). Önce bunları silin, sonra Excel'i yeniden yükleyin.</p><button onclick="A.clean()">Hatalı kayıtları sil</button>`:''}${S.imp?`<p><b>${S.imp.length} yeni hasta bulundu</b>${S.impSkip?`, ${S.impSkip} kişi zaten kayıtlı olduğu için atlanacak`:''}${S.impNoTel?`, ${S.impNoTel} kişinin telefonu yok`:''}.</p><div class="m">Örnek: ${e(S.imp.slice(0,3).map(x=>x.name+' '+x.tel).join(' | '))}</div><button onclick="A.imp()">Bu hastaları aktar</button>`:''}${S.impMsg?`<p class="ok"><b>${e(S.impMsg)}</b></p>`:''}</div>`;

function patView(){
  const p=S.pat.find(x=>x.id===S.sel);if(!p){S.sel=null;return listView()}
  const b=billed(p.id),pd=paid(p.id);
  const h=[...S.trt.filter(x=>x.pid===p.id).map(x=>({...x,k:'trt'})),...S.pay.filter(x=>x.pid===p.id).map(x=>({...x,k:'pay'}))].sort((x,y)=>(y.date||'').localeCompare(x.date||'')||(y.at||0)-(x.at||0));
  const ap=S.apt.filter(x=>x.pid===p.id&&x.date>=td()).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time))[0];
  return `<button class="lnk" onclick="A.back()">‹ Hastalar</button><h2>${e(p.name)}</h2><div class="m">${e(p.tel)} ${e(p.note)}${p.birth?' · Doğum: '+fmt(p.birth):''}</div><details class="card" style="margin-top:8px"><summary>Bilgileri düzenle</summary><input id="eN" value="${e(p.name)}" placeholder="Ad soyad"><input id="eT" type="tel" value="${e(p.tel)}" placeholder="Telefon"><small>Doğum tarihi</small><input id="eB" type="date" value="${e(p.birth)}"><input id="eM" value="${e(p.note)}" placeholder="Not"><button onclick="A.upd('${p.id}')">Güncelle</button></details>${ap?`<div class="m">Sonraki randevu: ${fmt(ap.date)} ${e(ap.time)}</div>`:''}
<div class="grid" style="margin-top:10px"><div class="card"><small>İşlem toplamı</small><b>${tl(b)}</b></div><div class="card"><small>Ödenen</small><b>${tl(pd)}</b></div><div class="card"><small>Kalan borç</small><b class="${b-pd>0?'bad':'ok'}">${tl(b-pd)}</b></div></div>
<h3>İşlem ekle (yapılan uygulama)</h3><div class="card"><label class="lb">İşlem türü</label><select id="tT">${opts(TYPES)}</select><label class="lb">Tutar (₺)</label><input id="tA" type="number" inputmode="decimal" placeholder="Örnek: 5000"><label class="lb">Tarih</label><input id="tD" type="date" value="${td()}"><label class="lb">Not (isteğe bağlı)</label><input id="tN" placeholder="Bölge, ürün, miktar..."><button onclick="A.addTrt()">İşlemi kaydet</button></div>
<h3>Ödeme ekle (hastadan alınan para)</h3><div class="card"><label class="lb">Alınan tutar (₺)</label><input id="pA" type="number" inputmode="decimal" placeholder="Örnek: 2000"><label class="lb">Ödeme yöntemi</label><select id="pM">${opts(METHODS)}</select><label class="lb">Tarih</label><input id="pD" type="date" value="${td()}"><label class="lb">Not (isteğe bağlı)</label><input id="pN" placeholder="Taksit sayısı..."><button onclick="A.addPay()">Ödemeyi kaydet</button></div>
<h3>Geçmiş</h3>${h.map(x=>`<div class="card row"><div><b>${x.k==='trt'?e(x.type):'Ödeme: '+e(x.method)}</b><div class="m">${fmt(x.date)} ${e(x.note)}</div></div><div class="${x.k==='pay'?'ok':''}">${x.k==='pay'?'+':''}${tl(x.amt)}<span class="x" onclick="A.del('${x.k}','${x.id}')">✕</span></div></div>`).join('')||'<p class="m">Bu hastaya henüz işlem veya ödeme eklenmedi.</p>'}
<button class="del" onclick="A.delPat('${p.id}')">Hastayı ve tüm kayıtlarını sil</button>`}

const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function grid(y,m,big,c){
  const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=td();let h='';
  for(let i=0;i<first;i++)h+='<i></i>';
  for(let d=1;d<=n;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    h+=`<span class="d ${c[k]?'has':''} ${k===t?'now':''} ${k===S.cd?'sel':''}" ${big?`onclick="A.day('${k}')"`:''}>${d}${big&&c[k]?`<u>${c[k]}</u>`:''}</span>`}
  return h}
function calView(row){
  const c={};S.apt.forEach(x=>c[x.date]=(c[x.date]||0)+1);
  if(S.cm==null){const n=new Date();
    return `<div class="row"><button class="lnk" onclick="A.yr(-1)">‹</button><h3 style="margin:0">${S.y}</h3><button class="lnk" onclick="A.yr(1)">›</button></div><div class="yr">${AY.map((a,m)=>`<div class="mini" onclick="A.mon(${m})"><b class="${S.y===n.getFullYear()&&m===n.getMonth()?'bad':''}">${a}</b><div class="g7">${grid(S.y,m,false,c)}</div></div>`).join('')}</div><p class="m">Dolu günler renkli. Aya dokunarak açın. Yıllar arasında sınırsız gezebilirsiniz.</p><button class="lnk" onclick="A.today()">Bugüne git</button>`}
  const dl=S.cd?S.apt.filter(x=>x.date===S.cd).sort((x,y)=>x.time.localeCompare(y.time)):[];
  return `<div class="row"><button class="lnk" onclick="A.mon(null)">‹ ${S.y}</button><button class="lnk" onclick="A.mm(-1)">‹</button><b>${AY[S.cm]} ${S.y}</b><button class="lnk" onclick="A.mm(1)">›</button></div>
<div class="g7 big">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<small>${x}</small>`).join('')}${grid(S.y,S.cm,true,c)}</div>
${S.cd?`<h3>${fmt(S.cd)}</h3>${dl.map(x=>row(x,'')).join('')||'<p class="m">Bu gün randevu yok. Aşağıdan ekleyebilirsiniz.</p>'}`:'<p class="m">Günlere dokunarak o günün randevularını görün.</p>'}`}
function aptView(){
  const t=td(),l=[...S.apt].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  const up=l.filter(x=>x.date>=t),past=l.filter(x=>x.date<t).reverse().slice(0,15);
  const row=(x,c)=>{const p=S.pat.find(z=>z.id===x.pid);return `<div class="card row ${c}"><div onclick="A.open('${x.pid}')"><b>${e(x.time)} ${e(p?p.name:'Silinmiş hasta')}</b><div class="m">${fmt(x.date)}${x.date===t?' (bugün)':''} ${e(x.type)} ${e(x.note)}</div></div><span><span class="x" onclick="A.wa('apt','${x.id}')">💬</span><span class="x" onclick="A.del('apt','${x.id}')">✕</span></span></div>`};
  return `<h2>Takvim</h2><p class="help">Önce aya, sonra güne dokunun. Randevuyu sayfanın altındaki formdan ekleyin.</p>${calView(row)}<h3>Randevu ekle</h3><div class="card">${S.pat.length?`<label class="lb">Hasta ara</label><input id="aQ" placeholder="Adın bir kısmını yazın" oninput="A.aq(this.value)"><label class="lb">Hasta seçin</label><select id="aP">${S.pat.slice().sort((x,y)=>(x.name||'').localeCompare(y.name||'','tr')).slice(0,50).map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('')}</select><label class="lb">Tarih</label><input id="aD" type="date" value="${S.cd||t}"><label class="lb">Saat</label><input id="aT" type="time" value="10:00"><label class="lb">İşlem</label><select id="aY">${opts(TYPES.concat(['Kontrol']))}</select><label class="lb">Not (isteğe bağlı)</label><input id="aN" placeholder="Not"><button onclick="A.addApt()">Randevu ekle</button>`:'<p class="m">Randevu eklemek için önce Hastalar sekmesinden hasta ekleyin.</p>'}</div>
<h3>Yaklaşan</h3>${up.map(x=>row(x,'')).join('')||'<p class="m">Yaklaşan randevu yok.</p>'}
${past.length?`<h3>Geçmiş</h3>${past.map(x=>row(x,'past')).join('')}`:''}`}

function takipView(){
  const t=td(),soon=ymd(new Date(Date.now()+30*864e5)),tom=ymd(new Date(Date.now()+864e5));
  const dd=S.pat.map(p=>({p,d:debt(p.id)})).filter(x=>x.d>0).sort((x,y)=>y.d-x.d);
  const rc=[];
  S.pat.forEach(p=>{const l=S.trt.filter(x=>x.pid===p.id&&x.type==='Botoks').map(x=>x.date).sort().pop();if(!l)return;
    const n=addM(l,3);if(n>soon||S.apt.some(x=>x.pid===p.id&&x.date>=t&&x.type==='Botoks'))return;rc.push({p,l,n})});
  rc.sort((x,y)=>x.n.localeCompare(y.n));
  const ta=S.apt.filter(x=>x.date===tom).sort((x,y)=>x.time.localeCompare(y.time));
  const nm=id=>(S.pat.find(z=>z.id===id)||{}).name||'Silinmiş hasta';
  return `<h2>Takip</h2><p class="help">Hatırlatma gerekenler burada. 💬 düğmesi WhatsApp'ı hazır mesajla açar, siz sadece gönderin.</p><h3>Yarınki randevular</h3>${ta.map(x=>`<div class="card row"><div onclick="A.open('${x.pid}')"><b>${e(x.time)} ${e(nm(x.pid))}</b><div class="m">${e(x.type)}</div></div><span class="x" onclick="A.wa('apt','${x.id}')">💬</span></div>`).join('')||'<p class="m">Yarın için randevu yok.</p>'}
<h3>Botoks hatırlatma (3 ay)</h3>${rc.map(x=>`<div class="card row"><div onclick="A.open('${x.p.id}')"><b>${e(x.p.name)}</b><div class="m">Son botoks ${fmt(x.l)} · hatırlatma ${fmt(x.n)}${x.n<t?' (geçti)':''}</div></div><span class="x" onclick="A.wa('rc','${x.p.id}')">💬</span></div>`).join('')||'<p class="m">Önümüzdeki 30 günde hatırlatılacak botoks hastası yok.</p>'}
<h3>Borçlu hastalar</h3>${dd.map(x=>`<div class="card row"><div onclick="A.open('${x.p.id}')"><b>${e(x.p.name)}</b><div class="m">${e(x.p.tel)}</div></div><div><span class="bad">${tl(x.d)}</span><span class="x" onclick="A.wa('debt','${x.p.id}')">💬</span></div></div>`).join('')||'<p class="m">Borçlu hasta yok.</p>'}`}
function revView(){
  const dp=S.pay.filter(x=>x.date===S.d),dt=S.trt.filter(x=>x.date===S.d),mp=S.pay.filter(x=>(x.date||'').startsWith(S.m)),mt=S.trt.filter(x=>(x.date||'').startsWith(S.m));
  const open=S.pat.reduce((s,p)=>s+Math.max(0,debt(p.id)),0);
  const mv=Array.from({length:12},(_,i)=>sum(S.pay.filter(x=>(x.date||'').startsWith(S.ry+'-'+String(i+1).padStart(2,'0')))));const mx=Math.max(...mv,1);
  const chart=`<h3>Yıllık tahsilat</h3><div class="card"><div class="row"><button class="lnk" onclick="A.set('ry',${S.ry-1})">‹</button><b>${S.ry}: ${tl(sum(mv))}</b><button class="lnk" onclick="A.set('ry',${S.ry+1})">›</button></div><div class="bars">${mv.map((x,i)=>`<div><small>${x?Math.round(x/1000):''}</small><i style="height:${Math.round(x/mx*100)}px"></i><small>${AY[i].slice(0,3)}</small></div>`).join('')}</div><p class="m">Rakamlar bin ₺ cinsinden.</p></div>`;
  return `<h2>Ciro</h2><p class="help"><b>Tahsilat:</b> kasaya giren para. <b>Yapılan işlem:</b> verilen hizmetin toplam tutarı.</p><h3>Günlük</h3><div class="card"><input type="date" value="${S.d}" onchange="A.set('d',this.value||td())"><div class="g2"><div><small>Tahsilat</small><b>${tl(sum(dp))}</b></div><div><small>Yapılan işlem</small><b>${tl(sum(dt))}</b></div></div></div>
<h3>Aylık</h3><div class="card"><input type="month" value="${S.m}" onchange="A.set('m',this.value||td().slice(0,7))"><div class="g2"><div><small>Tahsilat</small><b>${tl(sum(mp))}</b></div><div><small>Yapılan işlem</small><b>${tl(sum(mt))}</b></div></div>
${METHODS.map(k=>`<div class="row" style="margin-top:8px"><span class="m">${k}</span><span>${tl(sum(mp.filter(x=>x.method===k)))}</span></div>`).join('')}</div>
${chart}<div class="card"><small>Tüm hastaların toplam açık borcu</small><div class="bad" style="font-size:22px">${tl(open)}</div></div>
<button onclick="A.bak()">Yedeği indir</button><button class="lnk" onclick="A.out()">Çıkış yap</button>`}

function render(){
  const a=document.getElementById('app');
  if(!S.u){a.innerHTML=loginView();return}
  const view=S.sel?patView():S.tab==='apt'?aptView():S.tab==='rev'?revView():S.tab==='trk'?takipView():listView();
  const nb=(k,i,n)=>`<button class="${S.tab===k&&!S.sel?'on':''}" onclick="A.tab('${k}')"><big>${i}</big>${n}</button>`;
  a.innerHTML=`<header class="top"><img src="${LOGO}" alt="Logo"><div><b>Dr. Veysel Özcan</b><span>${S.u.email&&NAMES[S.u.email.toLowerCase()]?'Hoş geldiniz, '+NAMES[S.u.email.toLowerCase()]:'Hasta Takip Sistemi'}</span></div></header><main>${S.err?`<div class="err">${e(S.err)}</div>`:''}${view}</main><nav>${nb('pat','👥','Hastalar')}${nb('apt','📅','Takvim')}${nb('trk','🔔','Takip')}${nb('rev','💰','Ciro')}</nav>`;
}

const num=id=>parseFloat(v(id).replace(',','.'));
const add=(k,d)=>addDoc(collection(db,C[k]),{...d,at:Date.now()}).catch(er=>{S.err='Kaydedilemedi ('+er.code+')';render()});
window.A={
  login(){signInWithEmailAndPassword(auth,v('em'),document.getElementById('pw').value).catch(()=>{S.err='E-posta veya şifre hatalı.';render()})},
  out(){signOut(auth)},
  tab(t){S.tab=t;S.sel=null;render();scrollTo(0,0)},
  open(id){S.sel=id;render();scrollTo(0,0)},
  back(){S.sel=null;S.tab='pat';render()},
  set(k,x){S[k]=x;render()},
  yr(n){S.y+=n;render()},
  mon(m){S.cm=m;S.cd=null;render()},
  mm(n){let m=S.cm+n;if(m<0){m=11;S.y--}else if(m>11){m=0;S.y++}S.cm=m;S.cd=null;render()},
  day(k){S.cd=k;render()},
  xl(f){if(!f)return;S.impMsg='';const r=new FileReader();
    r.onerror=()=>alert('Dosya okunamadı.');
    r.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const x=parseImp(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}),S.pat);
      if(x.err)return alert(x.err);
      S.imp=x.out;S.impSkip=x.skip;S.impNoTel=x.noTel;if(!x.out.length)S.impMsg='Yeni hasta bulunamadı. Hepsi zaten kayıtlı olabilir.';render()
    }catch(er){alert('Dosya okunamadı. Excel (.xlsx) ya da .csv olmalı.')}};
    r.readAsArrayBuffer(f)},
  imp(){const l=S.imp;if(!l)return;S.imp=null;S.impMsg=l.length+' hasta ekleniyor, lütfen bekleyin (1-2 dakika sürebilir)...';render();
    bulk(l,(b,x)=>b.set(doc(collection(db,C.pat)),{name:x.name,tel:x.tel,birth:'',note:'',at:Date.now()})).then(()=>{S.impMsg=l.length+' hasta eklendi.';render()}).catch(er=>{S.err='Aktarılamadı ('+er.code+')';render()})},
  clean(){const l=bad().filter(p=>!S.trt.some(x=>x.pid===p.id)&&!S.pay.some(x=>x.pid===p.id)&&!S.apt.some(x=>x.pid===p.id));if(!l.length)return;
    if(!confirm(l.length+' hatalı kayıt silinsin mi? Bunlarda işlem, ödeme ya da randevu yok.'))return;
    S.impMsg='Siliniyor, lütfen bekleyin...';render();
    bulk(l,(b,p)=>b.delete(doc(db,C.pat,p.id))).then(()=>{S.impMsg=l.length+' hatalı kayıt silindi. Şimdi Excel dosyasını yeniden yükleyebilirsiniz.';render()}).catch(er=>{S.err='Silinemedi ('+er.code+')';render()})},
  aq(q){q=nz(q).trim();document.getElementById('aP').innerHTML=S.pat.filter(p=>!q||nz(p.name).includes(q)).sort((x,y)=>(x.name||'').localeCompare(y.name||'','tr')).slice(0,50).map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('')},
  today(){const n=new Date();S.y=n.getFullYear();S.cm=n.getMonth();S.cd=td();render()},
  upd(id){const n=v('eN');if(!n)return alert('Ad soyad yazın.');updateDoc(doc(db,C.pat,id),{name:n,tel:v('eT'),birth:v('eB'),note:v('eM')}).catch(er=>{S.err='Güncellenemedi ('+er.code+')';render()})},
  wa(k,id){let p,m;
    if(k==='apt'){const x=S.apt.find(z=>z.id===id);if(!x)return;p=S.pat.find(z=>z.id===x.pid);if(!p)return;m=`Merhaba ${p.name}, ${fmt(x.date)} saat ${x.time} randevunuzu hatırlatmak isteriz. Görüşmek üzere. Dr. Veysel Özcan`}
    else{p=S.pat.find(z=>z.id===id);if(!p)return;
      m=k==='rc'?`Merhaba ${p.name}, son botoks uygulamanızın üzerinden yaklaşık 3 ay geçti. Yenileme için uygun olduğunuzda randevu oluşturabiliriz. Dr. Veysel Özcan`:`Merhaba ${p.name}, kliniğimizdeki ${tl(debt(id))} tutarındaki kalan bakiyeniz hakkında bilgi vermek istedik. İyi günler dileriz. Dr. Veysel Özcan`}
    const u=waUrl(p.tel,m);if(!u)return alert('Telefon numarası eksik. Hasta sayfasından "Bilgileri düzenle" ile ekleyin.');window.open(u,'_blank')},
  q(x){S.q=x;document.getElementById('pl').innerHTML=plist()},
  addPat(){const n=v('pn');if(!n)return alert('Ad soyad yazın.');add('pat',{name:n,tel:v('pt'),birth:v('pb'),note:v('pm')})},
  addTrt(){const a=num('tA');if(!(a>=0))return alert('Tutarı yazın.');add('trt',{pid:S.sel,type:v('tT'),amt:a,date:v('tD')||td(),note:v('tN')})},
  addPay(){const a=num('pA');if(!(a>0))return alert('Tutarı yazın.');add('pay',{pid:S.sel,amt:a,method:v('pM'),date:v('pD')||td(),note:v('pN')})},
  addApt(){add('apt',{pid:v('aP'),date:v('aD')||td(),time:v('aT')||'10:00',type:v('aY'),note:v('aN')})},
  del(k,id){if(confirm('Bu kayıt silinsin mi?'))deleteDoc(doc(db,C[k],id))},
  delPat(id){if(!confirm('Hasta ve tüm işlem, ödeme, randevu kayıtları silinsin mi? Geri alınamaz.'))return;
    ['trt','pay','apt'].forEach(k=>S[k].filter(x=>x.pid===id).forEach(x=>deleteDoc(doc(db,C[k],x.id))));
    deleteDoc(doc(db,C.pat,id));S.sel=null;render()},
  bak(){const j=JSON.stringify({tarih:td(),hastalar:S.pat,islemler:S.trt,odemeler:S.pay,randevular:S.apt},null,1);
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download='klinik-yedek-'+td()+'.json';l.click()}
};
</script>
</body>
</html>
